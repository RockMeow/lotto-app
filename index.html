<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>彩券全參數版路與固定機率掃描系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .edit-cell { cursor: pointer; transition: background-color 0.2s; }
        .edit-cell:hover { background-color: #e2e8f0; }
        .edit-cell:focus { background-color: #fff; outline: 2px solid #3b82f6; }
        .hit-bar { display: inline-block; letter-spacing: 2px; font-family: monospace; }
        .hit { color: #10b981; }
        .miss { color: #d1d5db; }
        table th { position: sticky; top: 0; background-color: #f3f4f6; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 p-6 min-h-screen">

<div class="max-w-6xl mx-auto space-y-6">
    <h1 class="text-3xl font-bold text-center text-blue-700">🎰 版路掃描與回測系統 (Web 版)</h1>

    <!-- 控制面板 -->
    <div class="bg-white rounded-lg shadow p-6">
        <h2 class="text-xl font-bold mb-4 border-b pb-2">⚙️ 系統設定與回測</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <!-- 掃描設定區 (左) -->
            <div class="space-y-4 border-r pr-4">
                <div>
                    <label class="block font-semibold text-blue-800">1. 選擇彩種 (自動載入數據):</label>
                    <select id="lotteryType" class="border rounded p-2 w-full mt-1 bg-blue-50 focus:bg-white transition" onchange="loadSelectedLottery()">
                        <option value="539">今彩539</option>
                        <option value="daily">加州天天樂</option>
                        <option value="ghana">迦納彩</option>
                    </select>
                </div>
                <div class="bg-gray-50 p-3 rounded border">
                    <p id="fileStatus" class="text-sm font-semibold text-gray-600">正在準備載入檔案...</p>
                    <button onclick="downloadCSV()" class="mt-3 bg-green-500 hover:bg-green-600 text-white px-3 py-1.5 rounded text-sm font-semibold transition w-full shadow-sm">
                        ⬇️ 匯出目前修改的 CSV
                    </button>
                    <p class="text-xs text-gray-400 mt-1">※ 若在網頁上編輯了號碼，請匯出並推送到 GitHub 以永久更新。</p>
                </div>
            </div>

            <!-- 掃描設定區 (右) -->
            <div class="space-y-4">
                <div>
                    <label class="block font-semibold">2. 回測截止日期 (隱藏未來數據):</label>
                    <input type="date" id="backtestDate" class="border rounded p-1.5 w-full mt-1">
                    <p class="text-xs text-gray-400 mt-1">設定後，該日期「之後」的數據將作為驗證解答，不參與運算。</p>
                </div>
                <div>
                    <label class="block font-semibold">3. 掃描模式:</label>
                    <div class="flex items-center space-x-4 mt-1 bg-gray-50 p-2 rounded">
                        <label class="cursor-pointer"><input type="radio" name="scanMode" value="all" checked onchange="toggleFixedInput()"> 全參數掃描</label>
                        <label class="cursor-pointer"><input type="radio" name="scanMode" value="fixed" onchange="toggleFixedInput()"> 固定機率</label>
                    </div>
                </div>
                <div id="fixedNumbersDiv" class="hidden">
                    <label class="block font-semibold text-sm">輸入固定號碼 (空格分隔, 例: 1 3 9 11):</label>
                    <input type="text" id="fixedNumbersInput" class="border rounded p-1.5 w-full mt-1" placeholder="01 03 09 11 19 23 31">
                </div>
            </div>
        </div>
        
        <div class="mt-6 text-center">
            <button onclick="runScan()" id="runBtn" class="bg-blue-600 hover:bg-blue-700 text-white text-lg font-bold py-2 px-10 rounded-full shadow-lg transition w-full md:w-auto cursor-not-allowed opacity-50" disabled>
                🚀 開始運算
            </button>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- 左側：數據編輯器 -->
        <div class="bg-white rounded-lg shadow p-4 lg:col-span-1 h-[600px] flex flex-col">
            <div class="flex justify-between items-center mb-2">
                <h2 class="text-lg font-bold">📝 開獎數據編輯區</h2>
                <button onclick="addNewDraw()" class="bg-indigo-500 hover:bg-indigo-600 text-white px-2 py-1 rounded text-xs font-semibold shadow">
                    + 新增一期
                </button>
            </div>
            <div class="overflow-y-auto flex-1 border rounded bg-gray-50">
                <table class="min-w-full text-center text-sm border-collapse bg-white">
                    <thead>
                        <tr class="bg-gray-200">
                            <th class="border p-2">日期</th>
                            <th class="border p-2">N1</th><th class="border p-2">N2</th><th class="border p-2">N3</th><th class="border p-2">N4</th><th class="border p-2">N5</th>
                            <th class="border p-2">操作</th>
                        </tr>
                    </thead>
                    <tbody id="dataTableBody">
                        <!-- 資料由 JS 動態填入 -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 右側：掃描結果 -->
        <div class="bg-white rounded-lg shadow p-6 lg:col-span-2 h-[600px] overflow-y-auto" id="resultsArea">
            <h2 class="text-xl font-bold mb-4 border-b pb-2">📊 分析結果與回測驗證</h2>
            <div id="resultsContent" class="text-gray-600 flex justify-center items-center h-full">
                <p>等待載入數據與運算...</p>
            </div>
        </div>

    </div>
</div>

<script>
    const WD_LABELS = ['日', '一', '二', '三', '四', '五', '六'];
    const PAIRS_539 = [['一二', [1, 2]], ['二三', [2, 3]], ['三四', [3, 4]], ['四五', [4, 5]], ['五六', [5, 6]]];
    const PAIRS_DAILY = [['一二', [1, 2]], ['二三', [2, 3]], ['三四', [3, 4]], ['四五', [4, 5]], ['五六', [5, 6]], ['六日', [6, 0]], ['日一', [0, 1]]];

    // 對應 GitHub 上面的檔案名稱 (必須完全符合)
    const FILE_MAPPING = {
        '539': '今彩539_2026開獎數據.csv',
        'daily': '加州天天樂_2026開獎數據.csv',
        'ghana': '迦納彩_2026開獎數據.csv'
    };

    let globalDraws = []; 
    let originalHeaders = []; 
    let currentLotteryName = "";

    // 網頁載入完成後，自動觸發第一次讀取
    document.addEventListener("DOMContentLoaded", () => {
        loadSelectedLottery();
    });

    /* =======================================================================
       1. 網路請求載入 CSV 檔案
       ======================================================================= */
    function loadSelectedLottery() {
        const type = document.getElementById('lotteryType').value;
        const filename = FILE_MAPPING[type];
        currentLotteryName = document.getElementById('lotteryType').options[document.getElementById('lotteryType').selectedIndex].text;
        
        const statusEl = document.getElementById('fileStatus');
        statusEl.innerHTML = `⏳ 正在從伺服器讀取 <strong>${filename}</strong> ...`;
        
        // 停用運算按鈕
        document.getElementById('runBtn').disabled = true;
        document.getElementById('runBtn').classList.add('cursor-not-allowed', 'opacity-50');

        // 使用 fetch 抓取同目錄下的 CSV 檔案
        fetch(filename)
            .then(response => {
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                return response.text();
            })
            .then(csvText => {
                Papa.parse(csvText, {
                    header: false,
                    skipEmptyLines: true,
                    complete: function(results) {
                        processCSVData(results.data, filename);
                    }
                });
            })
            .catch(error => {
                console.error('Error fetching file:', error);
                statusEl.innerHTML = `<span class="text-red-500">❌ 無法讀取 ${filename}。請確認 GitHub 上有這個檔案。</span>`;
                globalDraws = [];
                renderTable();
            });
    }

    function processCSVData(data, filename) {
        if(data.length < 2) return alert('資料格式錯誤或為空');
        
        originalHeaders = data[0];
        globalDraws = [];

        for (let i = 1; i < data.length; i++) {
            const row = data[i];
            const dateStr = row[0].trim();
            if (!dateStr) continue;
            
            const nums = [parseInt(row[1]), parseInt(row[2]), parseInt(row[3]), parseInt(row[4]), parseInt(row[5])];
            if (nums.some(isNaN)) continue;
            
            const wd = new Date(dateStr).getDay(); 
            globalDraws.push({ date: dateStr, nums: nums, wd: wd });
        }

        const statusEl = document.getElementById('fileStatus');
        statusEl.innerHTML = `✅ <strong>${currentLotteryName}</strong> 已載入<br><span class="text-xs text-gray-500">共 ${globalDraws.length} 期 (${globalDraws[0].date} ~ ${globalDraws[globalDraws.length-1].date})</span>`;
        
        // 預設回測日期為資料的最後一天
        document.getElementById('backtestDate').value = globalDraws[globalDraws.length-1].date;
        
        enableRunButton();
        renderTable();
        document.getElementById('resultsContent').innerHTML = '<p>準備就緒，請點擊「開始運算」</p>';
    }

    /* =======================================================================
       2. UI 切換與按鈕控制
       ======================================================================= */
    function toggleFixedInput() {
        const mode = document.querySelector('input[name="scanMode"]:checked').value;
        document.getElementById('fixedNumbersDiv').style.display = mode === 'fixed' ? 'block' : 'none';
    }

    function enableRunButton() {
        const btn = document.getElementById('runBtn');
        btn.disabled = false;
        btn.classList.remove('cursor-not-allowed', 'opacity-50');
    }

    /* =======================================================================
       3. 資料表編輯與下載
       ======================================================================= */
    function renderTable() {
        const tbody = document.getElementById('dataTableBody');
        tbody.innerHTML = '';
        
        const displayLimit = 50; // 為避免卡頓，只顯示最新的 50 筆
        const startIndex = Math.max(0, globalDraws.length - displayLimit);
        
        for (let i = globalDraws.length - 1; i >= startIndex; i--) {
            const d = globalDraws[i];
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="border p-2 text-xs edit-cell font-mono" contenteditable="true" onblur="updateData(${i}, 'date', this)">${d.date}</td>
                <td class="border p-2 edit-cell font-bold" contenteditable="true" onblur="updateData(${i}, 0, this)">${pad(d.nums[0])}</td>
                <td class="border p-2 edit-cell font-bold" contenteditable="true" onblur="updateData(${i}, 1, this)">${pad(d.nums[1])}</td>
                <td class="border p-2 edit-cell font-bold" contenteditable="true" onblur="updateData(${i}, 2, this)">${pad(d.nums[2])}</td>
                <td class="border p-2 edit-cell font-bold" contenteditable="true" onblur="updateData(${i}, 3, this)">${pad(d.nums[3])}</td>
                <td class="border p-2 edit-cell font-bold" contenteditable="true" onblur="updateData(${i}, 4, this)">${pad(d.nums[4])}</td>
                <td class="border p-2"><button onclick="deleteData(${i})" class="text-red-500 font-bold hover:bg-red-100 px-2 rounded">X</button></td>
            `;
            tbody.appendChild(tr);
        }
    }

    function updateData(index, field, element) {
        const val = element.innerText.trim();
        if (field === 'date') {
            globalDraws[index].date = val;
            globalDraws[index].wd = new Date(val).getDay();
        } else {
            const num = parseInt(val);
            if (!isNaN(num)) globalDraws[index].nums[field] = num;
        }
    }

    function deleteData(index) {
        if(confirm(`確定刪除 ${globalDraws[index].date} 的數據嗎？`)){
            globalDraws.splice(index, 1);
            renderTable();
        }
    }

    function addNewDraw() {
        let lastDate = new Date();
        if (globalDraws.length > 0) {
            lastDate = new Date(globalDraws[globalDraws.length-1].date);
            lastDate.setDate(lastDate.getDate() + 1);
        }
        const newDateStr = lastDate.toISOString().split('T')[0];
        
        globalDraws.push({ date: newDateStr, nums: [1, 2, 3, 4, 5], wd: lastDate.getDay() });
        renderTable();
        document.getElementById('dataTableBody').parentElement.parentElement.scrollTop = 0;
    }

    function downloadCSV() {
        if(globalDraws.length === 0) return alert('無數據可匯出');
        const type = document.getElementById('lotteryType').value;
        const filename = FILE_MAPPING[type]; // 匯出時使用對應的檔名
        
        let csvContent = originalHeaders.join(',') + '\n';
        globalDraws.forEach(d => { csvContent += `${d.date},${d.nums.join(',')}\n`; });
        
        const blob = new Blob([new Uint8Array([0xEF, 0xBB, 0xBF]), csvContent], {type: 'text/csv;charset=utf-8;'});
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", filename);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    /* =======================================================================
       4. 演算法共用工具與核心運算
       ======================================================================= */
    function pad(n) { return n < 10 ? '0' + n : n; }
    function getDaysDiff(d1Str, d2Str) { return Math.round((new Date(d2Str) - new Date(d1Str)) / 86400000); }
    function getCombinations2(arr) {
        const results = [];
        for (let i = 0; i < arr.length; i++) {
            for (let j = i + 1; j < arr.length; j++) results.push([arr[i], arr[j]]);
        }
        return results;
    }

    function scanPairAll(draws, pairName, targetWds) {
        let results = [];
        for (let srcWd = 0; srcWd < 7; srcWd++) {
            let srcIdxs = draws.map((d, i) => d.wd === srcWd ? i : -1).filter(i => i !== -1);
            if (srcIdxs.length < 5) continue;
            for (let srcPos = 0; srcPos < 5; srcPos++) {
                let sdList = [];
                for (let si of srcIdxs) {
                    let tgtNums = new Set();
                    for (let j = si + 1; j < draws.length; j++) {
                        if (getDaysDiff(draws[si].date, draws[j].date) > 7) break;
                        if (targetWds.includes(draws[j].wd)) draws[j].nums.forEach(n => tgtNums.add(n));
                    }
                    if (tgtNums.size > 0) sdList.push({ srcVal: draws[si].nums[srcPos], tgtNums: tgtNums, date: draws[si].date });
                }
                
                if (sdList.length < 5) continue;
                let allTgt = new Set();
                sdList.forEach(sd => sd.tgtNums.forEach(n => allTgt.add(n)));
                let candidates = Array.from(allTgt).sort((a,b)=>a-b);
                if (candidates.length < 2) continue;
                
                let N = sdList.length, pairs = getCombinations2(candidates);
                for (let ht = 1; ht <= 50; ht++) {
                    let bestHits = 0, bestIdx = -1, bestResultsBool = [];
                    for (let p = 0; p < pairs.length; p++) {
                        let pn1 = pairs[p][0], pn2 = pairs[p][1], currentHits = 0, boolArray = [];
                        for (let k = 0; k < N; k++) {
                            let sd = sdList[k], expHe = ht - sd.srcVal;
                            let isHit = sd.tgtNums.has(pn1) || sd.tgtNums.has(pn2) || (expHe >= 1 && expHe <= 39 && sd.tgtNums.has(expHe));
                            boolArray.push(isHit);
                            if (isHit) currentHits++;
                        }
                        if (currentHits > bestHits) { bestHits = currentHits; bestIdx = p; bestResultsBool = boolArray; }
                    }
                    
                    if (bestHits / N < 0.80 || N < 5 || bestIdx < 0) continue;
                    let streak = 0, cur = 0;
                    bestResultsBool.forEach(r => { cur = r ? cur + 1 : 0; streak = Math.max(streak, cur); });
                    
                    results.push({
                        srcWd: srcWd, srcPos: srcPos + 1, heTarget: ht, probNums: pairs[bestIdx],
                        hits: bestHits, tests: N, hitRate: Math.round((bestHits / N) * 100), streak: streak,
                        latestHe: ht - sdList[sdList.length - 1].srcVal, resultsBool: bestResultsBool, latestDate: sdList[sdList.length - 1].date
                    });
                }
            }
        }
        results.sort((a, b) => (b.hitRate * 100 + b.tests * 3 + b.streak * 5) - (a.hitRate * 100 + a.tests * 3 + a.streak * 5));
        return results;
    }

    function scanFixedProb(draws, pairWds, allowedNums) {
        let results = [], allowedSet = new Set(allowedNums);
        for (let sw = 0; sw < 7; sw++) {
            let srcIdxs = draws.map((d, i) => d.wd === sw ? i : -1).filter(i => i !== -1);
            if (srcIdxs.length < 5) continue;
            for (let sp = 0; sp < 5; sp++) {
                let sdList = [];
                for (let si of srcIdxs) {
                    let tgt = new Set();
                    for (let j = si + 1; j < draws.length; j++) {
                        if (getDaysDiff(draws[si].date, draws[j].date) > 7) break;
                        if (pairWds.includes(draws[j].wd)) draws[j].nums.forEach(n => tgt.add(n));
                    }
                    if (tgt.size > 0) sdList.push({ srcVal: draws[si].nums[sp], tgt: tgt, date: draws[si].date });
                }
                
                if (sdList.length < 5) continue;
                let N = sdList.length, pairs = getCombinations2(allowedNums);
                for (let p of pairs) {
                    let pn1 = p[0], pn2 = p[1];
                    for (let ht = 1; ht <= 50; ht++) {
                        let hits = 0, boolArray = [];
                        for (let k = 0; k < N; k++) {
                            let sd = sdList[k], expHe = ht - sd.srcVal;
                            let isHit = sd.tgt.has(pn1) || sd.tgt.has(pn2) || (expHe >= 1 && expHe <= 39 && sd.tgt.has(expHe));
                            boolArray.push(isHit);
                            if (isHit) hits++;
                        }
                        
                        if (hits / N < 0.8) continue;
                        let streak = 0, cur = 0;
                        boolArray.forEach(r => { cur = r ? cur + 1 : 0; streak = Math.max(streak, cur); });
                        
                        let latestHe = ht - sdList[sdList.length - 1].srcVal;
                        let predArray = [pn1, pn2, latestHe].filter(x => x>=1 && x<=39);
                        if (allowedNums.length >= 4 && !predArray.every(v => allowedSet.has(v))) continue;
                        if (!boolArray[boolArray.length - 1]) continue; 
                        
                        results.push({
                            srcWd: sw, srcPos: sp + 1, heTarget: ht, probNums: [pn1, pn2], latestHe: latestHe,
                            hits: hits, tests: N, hitRate: Math.round((hits / N) * 100), streak: streak, resultsBool: boolArray, latestDate: sdList[sdList.length - 1].date
                        });
                    }
                }
            }
        }
        results.sort((a, b) => b.streak !== a.streak ? b.streak - a.streak : b.hitRate - a.hitRate);
        return results;
    }

    function runScan() {
        const out = document.getElementById('resultsContent');
        out.innerHTML = '<div class="flex flex-col items-center justify-center h-full"><div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mb-4"></div><p class="text-blue-600 font-bold">⚙️ 正在運算數千條版路，請稍候...</p></div>';
        
        setTimeout(() => {
            const mode = document.querySelector('input[name="scanMode"]:checked').value;
            const lotType = document.getElementById('lotteryType').value;
            const backtestDateStr = document.getElementById('backtestDate').value;
            
            let filteredDraws = globalDraws.filter(d => d.date <= backtestDateStr);
            let validationDraws = globalDraws.filter(d => d.date > backtestDateStr);
            
            if (filteredDraws.length < 20) return out.innerHTML = '<p class="text-red-500">❌ 錯誤：回測日期前的數據過少，無法運算。</p>';

            const pairsConfig = lotType === '539' ? PAIRS_539 : PAIRS_DAILY;
            let finalHtml = `<div class="mb-4 p-3 bg-blue-50 border border-blue-200 rounded text-sm text-blue-800 flex justify-between items-center">
                <div><strong>📌 ${currentLotteryName} 執行摘要</strong><br>
                參與運算期數：${filteredDraws.length} 期 (至 ${filteredDraws[filteredDraws.length-1].date} 止)</div>
                <div class="text-right">未來驗證期數：<br><span class="font-bold text-lg">${validationDraws.length} 期</span></div>
            </div>`;

            if (mode === 'all') {
                for (let pair of pairsConfig) {
                    let pairName = pair[0], targetWds = pair[1];
                    let res = scanPairAll(filteredDraws, pairName, targetWds);
                    finalHtml += `<h3 class="text-lg font-bold text-gray-800 mt-6 mb-2 border-b-2 border-blue-100 pb-1">🧩 週${pairName[0]}週${pairName[1]}：命中 ${res.length} 條</h3>`;
                    
                    let limit = Math.min(res.length, 10);
                    for (let i = 0; i < limit; i++) {
                        let r = res[i];
                        let barArr = r.resultsBool.slice(-20);
                        let barHtml = `<span class="hit-bar">${barArr.map(x => x ? '<span class="hit">█</span>' : '<span class="miss">·</span>').join('')}</span>`;
                        
                        finalHtml += `<div class="mb-2 text-sm bg-gray-50 p-3 rounded border-l-4 border-blue-500 hover:shadow-md transition">
                            <strong class="text-base">${i+1}. 週${WD_LABELS[r.srcWd]}P${r.srcPos} 合${pad(r.heTarget)}</strong> 
                            <span class="text-gray-500 mx-2">→</span> 
                            <span class="bg-blue-100 text-blue-800 px-2 py-0.5 rounded">機率{${r.probNums.map(n=>pad(n)).join(', ')}}</span> 
                            <span class="bg-yellow-100 text-yellow-800 px-2 py-0.5 rounded">合數${pad(r.latestHe)}</span>
                            <span class="float-right text-gray-500 font-mono">${r.hits}/${r.tests} (${r.hitRate}%) 連${r.streak}</span>
                            <div class="mt-2 pt-2 border-t border-gray-200 flex items-center justify-between">
                                ${barHtml} ${checkValidation(r, validationDraws, targetWds)}
                            </div>
                        </div>`;
                    }
                }
            } else {
                let allowedNums = document.getElementById('fixedNumbersInput').value.trim().split(/\s+/).map(n => parseInt(n)).filter(n => !isNaN(n));
                if(allowedNums.length < 2) return out.innerHTML = '<p class="text-red-500">❌ 錯誤：固定機率模式至少需要輸入 2 個數字。</p>';
                finalHtml += `<div class="font-bold text-green-700 mb-4 bg-green-50 p-2 rounded">🎯 鎖定機率號碼: ${allowedNums.map(pad).join(' ')}</div>`;
                
                for (let pair of pairsConfig) {
                    let pairName = pair[0], targetWds = pair[1];
                    let res = scanFixedProb(filteredDraws, targetWds, allowedNums);
                    if(res.length > 0) {
                        finalHtml += `<h3 class="text-lg font-bold text-gray-800 mt-6 mb-2 border-b-2 border-green-100 pb-1">🧩 週${pairName[0]}週${pairName[1]}：命中 ${res.length} 條</h3>`;
                        let limit = Math.min(res.length, 5);
                        for (let i = 0; i < limit; i++) {
                            let r = res[i], barArr = r.resultsBool.slice(-20);
                            let barHtml = `<span class="hit-bar">${barArr.map(x => x ? '<span class="hit">█</span>' : '<span class="miss">·</span>').join('')}</span>`;
                            finalHtml += `<div class="mb-2 text-sm bg-gray-50 p-3 rounded border-l-4 border-green-500 hover:shadow-md transition">
                                <strong class="text-base">週${WD_LABELS[r.srcWd]}P${r.srcPos} 合${pad(r.heTarget)}</strong> 
                                <span class="text-gray-500 mx-2">→</span> 
                                <span class="bg-green-100 text-green-800 px-2 py-0.5 rounded">機率{${r.probNums.map(n=>pad(n)).join(', ')}}</span> 
                                <span class="bg-yellow-100 text-yellow-800 px-2 py-0.5 rounded">合${pad(r.latestHe)}</span>
                                <span class="float-right text-gray-500 font-mono">${r.hits}/${r.tests} (${r.hitRate}%) 連${r.streak}</span>
                                <div class="mt-2 pt-2 border-t border-gray-200 flex items-center justify-between">
                                    ${barHtml} ${checkValidation(r, validationDraws, targetWds)}
                                </div>
                            </div>`;
                        }
                    }
                }
            }
            out.innerHTML = finalHtml;
        }, 100);
    }

    function checkValidation(recommendation, validationDraws, targetWds) {
        if (validationDraws.length === 0) return `<span class="text-xs bg-gray-200 text-gray-600 px-2 py-1 rounded">等待開獎</span>`;
        let targetFutureDraw = validationDraws.find(d => targetWds.includes(d.wd));
        if (!targetFutureDraw) return `<span class="text-xs bg-gray-200 text-gray-600 px-2 py-1 rounded">尚無對應星期資料</span>`;
        
        let hitProb = recommendation.probNums.some(n => targetFutureDraw.nums.includes(n));
        let expectedHe = recommendation.latestHe;
        let hitHe = (expectedHe >= 1 && expectedHe <= 39 && targetFutureDraw.nums.includes(expectedHe));
        
        if (hitProb || hitHe) {
            let hitDetails = [];
            if(hitProb) hitDetails.push("機率");
            if(hitHe) hitDetails.push("合數");
            return `<span class="text-xs bg-green-100 text-green-700 font-bold px-2 py-1 rounded border border-green-300">🎯 驗證命中: ${targetFutureDraw.date} (${hitDetails.join('+')})</span>`;
        } else {
            return `<span class="text-xs bg-red-50 text-red-500 px-2 py-1 rounded border border-red-200">❌ 驗證未中: ${targetFutureDraw.date}</span>`;
        }
    }
</script>
